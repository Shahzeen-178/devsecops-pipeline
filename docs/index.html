<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevSecOps Security Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    margin: 0;
    padding: 40px 20px;
  }
  h1 { text-align: center; font-size: 1.8rem; margin-bottom: 4px; }
  p.subtitle { text-align: center; color: #8b949e; margin-top: 0; margin-bottom: 40px; }
  .container { max-width: 900px; margin: 0 auto; }
  .chart-box {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 30px;
  }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid #30363d; font-size: 0.9rem; }
  th { color: #8b949e; font-weight: 600; }
  .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; }
  .badge.zero { background: #1f6f43; color: #7ee2a8; }
  .badge.nonzero { background: #6e1f24; color: #ffb3b8; }
  #empty-msg { text-align: center; color: #8b949e; margin-top: 60px; }
</style>
</head>
<body>
  <div class="container">
    <h1>🛡️ DevSecOps Security Dashboard</h1>
    <p class="subtitle">Security scan history for this repository</p>

    <div id="content" style="display:none;">
      <div class="chart-box">
        <canvas id="trendChart" height="100"></canvas>
      </div>

      <div class="chart-box">
        <h3 style="margin-top:0;">Recent Scans</h3>
        <table id="history-table">
          <thead>
            <tr><th>Date</th><th>Commit</th><th>Secrets Found</th><th>Vulnerabilities Found</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <p id="empty-msg">No scan history yet — this fills in after your first pipeline run.</p>
  </div>

<script>
fetch('history.json')
  .then(r => r.json())
  .then(data => {
    if (!data || data.length === 0) return;

    document.getElementById('content').style.display = 'block';
    document.getElementById('empty-msg').style.display = 'none';

    const labels = data.map(d => d.date);
    const secrets = data.map(d => d.secrets_found);
    const vulns = data.map(d => d.vulnerabilities_found);

    new Chart(document.getElementById('trendChart'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: 'Secrets Found', data: secrets, borderColor: '#ff7b72', tension: 0.3 },
          { label: 'Vulnerabilities Found', data: vulns, borderColor: '#58a6ff', tension: 0.3 }
        ]
      },
      options: {
        plugins: { legend: { labels: { color: '#e6edf3' } } },
        scales: {
          x: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
          y: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' }, beginAtZero: true }
        }
      }
    });

    const tbody = document.querySelector('#history-table tbody');
    [...data].reverse().forEach(d => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${d.date}</td>
        <td>${d.commit}</td>
        <td><span class="badge ${d.secrets_found > 0 ? 'nonzero' : 'zero'}">${d.secrets_found}</span></td>
        <td><span class="badge ${d.vulnerabilities_found > 0 ? 'nonzero' : 'zero'}">${d.vulnerabilities_found}</span></td>
      `;
      tbody.appendChild(row);
    });
  })
  .catch(() => {
    // history.json abhi maujood nahi — pehli baar pipeline chalne se pehle
  });
</script>
</body>
</html>
